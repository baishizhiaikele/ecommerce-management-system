# Alembic configuration for AI Shop backend.

[alembic]
# migration scripts directory (relative to this file = backend root)
script_location = migrations
# add backend root to sys.path so `import app` works
prepend_sys_path = .
# The actual DB URL is provided dynamically by migrations/env.py from app settings.
# This is only a placeholder to keep Alembic from erroring when no URL is injected.
sqlalchemy.url = sqlite+aiosqlite:///./ai_shop.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

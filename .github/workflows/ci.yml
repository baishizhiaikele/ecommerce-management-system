name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      SECRET_KEY: ci-test-secret-key
      PAYMENT_SECRET: ci-test-payment-secret-at-least-32-chars-long
      TESTING: "true"
      SEED_DEMO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
      - name: Schema gate (T18) - 纯 Alembic 建库，禁止静默补列
        # 生产等价配置：ALLOW_SCHEMA_AUTOFIX=False。
        # 验证数据库可由 Alembic 迁移完整建出，应用能在"无兜底补列"下启动，
        # 确保 schema 漂移会被暴露而非被 _ensure_demo_columns 掩盖。
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_schema.db
          SECRET_KEY: ci-test-secret-key
          PAYMENT_SECRET: ci-test-payment-secret-at-least-32-chars-long
          TESTING: "true"
          SEED_DEMO: "false"
          ALLOW_SCHEMA_AUTOFIX: "false"
        run: |
          python -m pip install alembic
          rm -f ci_schema.db
          alembic upgrade head
          python -c "import asyncio; from app.main import run_migrations; asyncio.run(run_migrations()); print('[schema-gate] run_migrations OK with ALLOW_SCHEMA_AUTOFIX=False')"
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
